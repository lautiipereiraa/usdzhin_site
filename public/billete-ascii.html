<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>usdzhin — billete ASCII</title>
<style>
  /* Los tokens replican los de index.css del sitio: el iframe es otro documento
     y no hereda sus variables, pero el trazo tiene que ser el mismo azul que el
     resto de usdzhin en cada tema. */
  :root, .theme-light {
    --ink: #1d4ed8;
    --glow: rgba(29, 78, 216, 0.16);
    /* Sin halo en claro: el glifo tiene que recortar contra el fondo, no fundirse. */
    --ink-glow: none;
    /* Bold en claro: el glifo fino no tiene suficiente tinta para recortar. */
    --ink-weight: 700;
  }

  .theme-dark {
    --ink: #60a5fa;
    --glow: rgba(96, 165, 250, 0.3);
    --ink-glow: 0 0 6px rgba(96, 165, 250, 0.35), 0 0 18px rgba(96, 165, 250, 0.12);
    --ink-weight: 400;
  }

  /* Fondo transparente a proposito: la seccion que embebe esta pagina pone el
     fondo del sitio y el billete queda flotando sobre el, sin franja propia.
     Suelta y sin contenedor el fondo oscuro de referencia es #050805. */
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }

  body {
    font-family: "Liberation Mono", "DejaVu Sans Mono", ui-monospace, SFMono-Regular,
                 Menlo, Consolas, monospace;
  }

  /* El <pre> y el canvas comparten exactamente la misma caja centrada, asi la
     onda revela el billete solido justo donde estaban los caracteres. */
  #ascii, #solid, #ring {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
  }

  #ascii {
    margin: 0;
    white-space: pre;
    font: inherit;
    line-height: 1;
    letter-spacing: 0;
    color: var(--ink);
    font-weight: var(--ink-weight);
    text-shadow: var(--ink-glow);
    user-select: none;
    -webkit-user-select: none;
    pointer-events: none;
    transition: color 300ms ease, text-shadow 300ms ease;
  }

  #solid {
    display: none;
    pointer-events: none;
  }

  /* Anillo del frente de onda: 1px, apenas visible, sin glow. */
  #ring {
    display: none;
    border: 1px solid var(--ink);
    opacity: 0.25;
    border-radius: 50%;
    pointer-events: none;
  }

  /* Capa de arrastre: cubre todo y se lleva los eventos de puntero, para que
     el <pre> pueda seguir siendo pointer-events:none. */
  #drag {
    position: fixed;
    inset: 0;
    /* pan-y y no none: en mobile el gesto vertical tiene que seguir scrolleando
       la pagina que contiene el iframe; solo el horizontal gira el billete. */
    touch-action: pan-y;
    cursor: default;
  }
  #drag.over { cursor: grab; }
  #drag.grabbing { cursor: grabbing; }

</style>
</head>
<body>
<pre id="ascii" aria-hidden="true"></pre>
<canvas id="solid"></canvas>
<div id="ring"></div>
<div id="drag"></div>

  // --- constantes -----------------------------------------------------------
  // Grilla / render target del pase ASCII. En vez de un tamaño fijo, un
  // presupuesto de celdas: la grilla se reparte segun el aspecto del viewport
  // (~240x90 en 16:9, mas ancha y baja en una franja apaisada) y asi la llena
  // sin franjas vacias, con el mismo costo de readback siempre.
  //

  // caracteres se lee como luminancia y el ojo integra celdas de 4px sin
  // problema; en claro cada glifo tiene que recortar contra el fondo, y a ese
  // tamaño el trazo azul se desvanece. Menos celdas = caracteres ~1.6x mas
  // grandes = billete legible.

  var CELL_BUDGET_LIGHT = 240 * 36;
  var COLS = 240, ROWS = 90;
  var RAMP = " .`':;-~+=*ox%O#@";               // vacio -> denso
  var GLITCH = "/\\|<>+*x%#=~;:";               // caracteres de desintegracion

  // el billete no hay forma de garantizar que no se corte.
  var MAX_TILT_X = 0.20;                        // sin(t) 0.06 + parallax 0.14
  var MAX_TILT_Z = 0.045;
  var FLOAT_Y = 0.05;
  var RIPPLE_Z = 0.05;

  // y al salir retirarse un poco mas rapido todavia para no quedar colgada.
  var WAVE_IN_MS = 1100;
  var WAVE_OUT_MS = 800;
  var HIT_PAD = 14;                             // margen del area sensible, px
  var FEATHER = 70;                             // pluma del borde de la onda, px
  var BAND = 0.16;                              // banda de desintegracion (x radio max)

  var preEl = document.getElementById("ascii");
  var canvasEl = document.getElementById("solid");
  var ringEl = document.getElementById("ring");
  var dragEl = document.getElementById("drag");

  // --- tema -----------------------------------------------------------------
  // El tema llega dos veces: en el query al cargar, para no pintar un frame con
  // el tema equivocado, y despues por postMessage cada vez que el usuario toca
  // el toggle del sitio. Cambiar el src del iframe recargaria los 360 KB y
  // reiniciaria la animacion.
  var theme = "dark";

  var started = false;

  function applyTheme(next) {
    theme = (next === "light") ? "light" : "dark";
    document.documentElement.className = "theme-" + theme;
    // La grilla depende del tema, no solo los colores: hay que recalcularla.
    if (started) layout();
  }

  applyTheme(new URLSearchParams(location.search).get("theme"));

  window.addEventListener("message", function (e) {
    if (e.source !== window.parent) return;
    if (!e.data || e.data.type !== "usdzhin:theme") return;
    applyTheme(e.data.theme);
  });

  // tamaño de la caja, y si no coincide con la fuente real el billete sale
  // estirado.
  function measureCharAspect() {
    var probe = document.createElement("canvas").getContext("2d");
    var size = 100;
    probe.font = size + "px " + getComputedStyle(document.body).fontFamily;
    var w = probe.measureText("M".repeat(20)).width / 20;
    var ratio = w / size;
    return (ratio > 0.3 && ratio < 1) ? ratio : 0.55;
  }

  var FOV = 12;

  var key = new THREE.DirectionalLight(0xffffff, 0.45);
  key.position.set(0.6, 0.9, 1.4);

  var rim = new THREE.DirectionalLight(0xffffff, 0.25);
  rim.position.set(-0.8, -0.4, -1.2);
  scene.add(rim);

    var v = (i / 255 - 0.5) * CONTRAST + 0.5 + BRIGHTNESS;
    v = v < 0 ? 0 : (v > 1 ? 1 : v);
    LUT_DARK[i] = Math.round(v * (RAMP.length - 1));

    var l = (LIGHT_HI - i) / (LIGHT_HI - LIGHT_LO);
    l = l < 0 ? 0 : (l > 1 ? 1 : l);
    // Piso en 1 ('.'): los blancos plenos (el ovalo de la marca de agua, el
    // margen derecho) quedarian vacios y el billete perderia la silueta.
    LUT_LIGHT[i] = Math.max(1, Math.round(l * (RAMP.length - 1)));
  }

  // --- estado ---------------------------------------------------------------
  var tex = null;
  var spin = 0;
  var spinVel = BASE_SPIN;
  var dragging = false;
  var lastPointerX = 0;
  var pointerX = 0, pointerY = 0;        // -1..1 respecto del centro
  var parallaxX = 0, parallaxY = 0;      // seguimiento suavizado
  // La onda es un valor continuo, no una transicion con hora de inicio: asi
  // sacar el puntero a mitad de camino la devuelve desde donde estaba, sin
  // esperar a que termine ni saltar.
  var waveT = 0;                         // 0 = ASCII, 1 = billete solido
  var waveTarget = 0;
  var originX = 0, originY = 0;          // desde donde se abre, respecto del centro
  var waveMax = 1;
  var overBill = false;
  var clock = new THREE.Clock();
  var cellW = 1, cellH = 1, boxW = 1, boxH = 1;
  var visibleH = 1;                      // alto del cuadro en unidades de escena


  function layout() {
    var w = window.innerWidth, h = window.innerHeight;

    var budget = (theme === "light") ? CELL_BUDGET_LIGHT : CELL_BUDGET_DARK;
    var minRows = (theme === "light") ? 40 : 64;
    ROWS = Math.max(minRows, Math.min(160, Math.round(Math.sqrt(budget * CHAR_ASPECT / (w / h)))));
    COLS = Math.max(80, Math.min(420, Math.round(budget / ROWS)));
    rt.setSize(COLS, ROWS);
    pixels = new Uint8Array(COLS * ROWS * 4);
    lineParts.length = COLS;
    lines.length = ROWS;

    // La fuente se ajusta sola para que la grilla entre completa en la ventana.
    var fontSize = Math.max(2, Math.min(w / (COLS * CHAR_ASPECT), h / ROWS));
    preEl.style.fontSize = fontSize + "px";
    cellW = fontSize * CHAR_ASPECT;
    cellH = fontSize;
    boxW = cellW * COLS;
    boxH = cellH * ROWS;
    renderer.setSize(boxW, boxH, true);

    // La caja tiene exactamente el aspecto de la grilla, asi que una sola
    // camara sirve para los dos pases y el solido calza donde estaba el ASCII.
    camera.aspect = boxW / boxH;
    // Encuadre automatico. El alto no sale de un "ocupa tanto por ciento del
    // cuadro" elegido a dedo, sino de la unica restriccion dura que hay: que el
    // billete no se corte nunca. Girando de canto su borde cercano queda a media
    // anchura de la camara y la perspectiva lo estira; ese es el caso que manda.
    var halfW = BILL_W / 2, halfH = BILL_H / 2;
    var tanF = Math.tan(FOV / 2 * Math.PI / 180);
    var zNear = halfW + halfH * MAX_TILT_X + RIPPLE_Z;   // lo mas cerca que llega
    var yMax = halfH + FLOAT_Y + halfW * MAX_TILT_Z;     // lo mas alto que se pone
    var dHeight = zNear + yMax / tanF;
    var dWidth = (BILL_W / 0.90) / (2 * tanF * camera.aspect);
    camera.position.z = Math.max(dHeight, dWidth);
    visibleH = 2 * camera.position.z * tanF;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", layout);

  // Con origen movil el radio que tapa todo ya no es la diagonal desde el
  // centro: es la distancia a la esquina mas lejana.
  function maxRadiusFrom(ox, oy) {
    var hw = boxW / 2, hh = boxH / 2;
    return Math.max(
      Math.hypot(ox + hw, oy + hh), Math.hypot(ox - hw, oy + hh),
      Math.hypot(ox + hw, oy - hh), Math.hypot(ox - hw, oy - hh)
    ) * 1.02;
  }

  // Area sensible: el rectangulo que ocupa el billete de frente, sin encoger
  // con el giro. Si siguiera a la silueta real, de canto seria imposible de
  // apuntar y se prenderia y apagaria solo.
  function isOverBill(px, py) {
    var billW = BILL_W / (visibleH * camera.aspect) * boxW;
    var billH = BILL_H / visibleH * boxH;
    return Math.abs(px) <= billW / 2 + HIT_PAD && Math.abs(py) <= billH / 2 + HIT_PAD;
  }

  // --- ondulacion del papel + flotacion -------------------------------------
  function ripple(t) {
    var pos = geometry.attributes.position;
    var arr = pos.array;
    for (var i = 0; i < arr.length; i += 3) {
      var x = basePos[i], y = basePos[i + 1];
      // Mas onda hacia los extremos horizontales: es como se comba un billete
      // sostenido por el centro.
      var weight = 0.35 + 0.65 * Math.abs(x / (BILL_W / 2));
      arr[i + 2] = (Math.sin(x * 2.1 + t * 1.4) * 0.05 + Math.sin(y * 3.1 - t * 1.1) * 0.022) * weight;
    }
    pos.needsUpdate = true;
    geometry.computeVertexNormals();
  }

  // --- pase ASCII -----------------------------------------------------------
  function renderAscii(radius) {
    matFront.map = tex.frontGray;
    matBack.map = tex.backGray;
    // El tema claro rinde con menos exposicion. Con la exposicion normal el 40%
    // del billete llega recortado en 255 y esa informacion ya no se recupera: en
    // oscuro no importa (es papel brillante), pero en claro es justo la zona que
    // deberia tener el grabado.
    var exposure = (theme === "light") ? LIGHT_EXPOSURE : 1;
    matFront.color.setScalar(exposure);
    matBack.color.setScalar(exposure);

    renderer.setRenderTarget(rt);
    renderer.clear();
    renderer.render(scene, camera);
    renderer.readRenderTargetPixels(rt, 0, 0, COLS, ROWS, pixels);
    renderer.setRenderTarget(null);

    var lut = (theme === "light") ? LUT_LIGHT : LUT_DARK;
    var band = BAND * waveMax;
    var disintegrating = radius > 0;
    var halfW = boxW / 2, halfH = boxH / 2;

    for (var row = 0; row < ROWS; row++) {
      // readRenderTargetPixels devuelve las filas de abajo hacia arriba.
      var srcRow = ROWS - 1 - row;
      var cy = (row + 0.5) * cellH - halfH - originY;
      for (var col = 0; col < COLS; col++) {
        var o = (srcRow * COLS + col) * 4;
        // El fondo del render target tiene alfa 0. Se descarta antes de la
        // rampa: con la LUT invertida del tema claro, un fondo vacio mapearia
        // al caracter mas denso y llenaria la pantalla.
        var ch;
        if (pixels[o + 3] < 128) {
          ch = " ";
        } else {
          var lum = 0.299 * pixels[o] + 0.587 * pixels[o + 1] + 0.114 * pixels[o + 2];
          ch = RAMP[lut[lum | 0]];
        }

        if (disintegrating) {
          var cx = (col + 0.5) * cellW - halfW - originX;
          var d = Math.sqrt(cx * cx + cy * cy);
          if (d < radius) {
            ch = " ";                              // ya paso la onda: no queda nada
          } else if (d < radius + band) {
            // Justo por fuera del frente: el caracter se descompone, con mas
            // probabilidad cuanto mas cerca del frente esta.
            var q = 1 - (d - radius) / band;
            if (Math.random() < q * q) {
              ch = Math.random() < 0.45 ? " " : GLITCH[(Math.random() * GLITCH.length) | 0];
            }
          }
        }
        lineParts[col] = ch;
      }
      lines[row] = lineParts.join("");
    }
    preEl.textContent = lines.join("\n");
  }

  // --- pase solido ----------------------------------------------------------
  function renderSolid(radius, full) {
    matFront.map = tex.frontColor;
    matBack.map = tex.backColor;
    matFront.color.setScalar(1);
    matBack.color.setScalar(1);

    if (full) {
      canvasEl.style.webkitMaskImage = "none";
      canvasEl.style.maskImage = "none";
    } else {
      // Mascara de gradiente radial en vez de clip-path: el borde de la onda
      // tiene que ser suave, no un recorte duro.
      var inner = Math.max(0, radius - FEATHER);
      var cx = boxW / 2 + originX, cy = boxH / 2 + originY;
      var g = "radial-gradient(circle at " + cx + "px " + cy + "px, #000 " +
              inner + "px, transparent " + radius + "px)";
      canvasEl.style.webkitMaskImage = g;
      canvasEl.style.maskImage = g;
    }

    renderer.setRenderTarget(null);
    renderer.render(scene, camera);
  }

  function showRing(radius, fade) {
    ringEl.style.display = "block";
    ringEl.style.width = (radius * 2) + "px";
    ringEl.style.height = (radius * 2) + "px";
    ringEl.style.transform = "translate(-50%, -50%) translate(" + originX + "px, " + originY + "px)";
    ringEl.style.opacity = 0.25 * fade;
  }

  // --- loop -----------------------------------------------------------------
  function frame() {
    requestAnimationFrame(frame);
    if (!tex) return;

    var dt = Math.min(clock.getDelta(), 0.1);
    var t = clock.getElapsedTime();
    var step = dt * 60;

    if (!dragging) {
      // Al soltar, la velocidad vuelve al giro base con inercia.
      spinVel += (BASE_SPIN - spinVel) * Math.min(1, 0.045 * step);
      spin += spinVel * step;
    }
    spinGroup.rotation.y = spin;

    // Parallax: el billete se orienta apenas hacia el puntero, encima de la
    // flotacion. Suavizado para que no salte con cada evento de mouse.
    parallaxX += (pointerX - parallaxX) * Math.min(1, 0.06 * step);
    parallaxY += (pointerY - parallaxY) * Math.min(1, 0.06 * step);
    pointerLight.position.set(parallaxX * 2.6, -parallaxY * 1.6, 2.2);

    tiltGroup.position.y = Math.sin(t * 0.7) * 0.05;
    tiltGroup.rotation.x = Math.sin(t * 0.5) * 0.06 + parallaxY * 0.14;
    tiltGroup.rotation.y = parallaxX * 0.12;
    tiltGroup.rotation.z = Math.sin(t * 0.37) * 0.04;
    ripple(t);

    // Avance de la onda hacia su objetivo.
    if (waveT !== waveTarget) {
      var dur = (waveTarget > waveT) ? WAVE_IN_MS : WAVE_OUT_MS;
      var stepT = (dt * 1000) / dur;
      waveT += (waveTarget > waveT) ? Math.min(stepT, waveTarget - waveT)
                                    : -Math.min(stepT, waveT - waveTarget);
    }

    var eased = 1 - Math.pow(1 - waveT, 3);        // ease-out cubico
    var radius = eased * waveMax;
    var transitioning = waveT > 0 && waveT < 1;
    var ringFade = (waveTarget > 0) ? (1 - waveT) : waveT;

    var wantAscii = waveT < 1;
    var wantSolid = waveT > 0;

    preEl.style.display = wantAscii ? "block" : "none";
    canvasEl.style.display = wantSolid ? "block" : "none";

    if (wantAscii) renderAscii(transitioning ? radius : 0);
    if (wantSolid) renderSolid(radius, waveT >= 1);
    if (transitioning) showRing(radius, ringFade); else ringEl.style.display = "none";
  }

  // --- interaccion ----------------------------------------------------------
  dragEl.addEventListener("pointerdown", function (e) {
    if (e.pointerType === "touch") {
      var px = e.clientX - window.innerWidth / 2;
      var py = e.clientY - window.innerHeight / 2;
      if (isOverBill(px, py)) {
        if (waveTarget === 1) closeWave(); else openWave(px, py);
      }
    }
    dragging = true;
    lastPointerX = e.clientX;
    dragEl.classList.add("grabbing");
    dragEl.setPointerCapture(e.pointerId);
  });
  // Abre la onda desde donde esta el puntero. El origen queda fijo hasta que la
  // onda vuelve al reposo, para que al cerrarse se recoja en el mismo punto.
  function openWave(px, py) {
    if (waveTarget === 1) return;
    originX = px;
    originY = py;
    waveMax = maxRadiusFrom(originX, originY);
    waveTarget = 1;
  }

  function closeWave() {
    waveTarget = 0;
  }

  function trackPointer(e) {
    var px = e.clientX - window.innerWidth / 2;
    var py = e.clientY - window.innerHeight / 2;
    pointerX = (e.clientX / window.innerWidth) * 2 - 1;
    pointerY = (e.clientY / window.innerHeight) * 2 - 1;

    overBill = isOverBill(px, py);
    dragEl.classList.toggle("over", overBill);
    return { px: px, py: py };
  }

  dragEl.addEventListener("pointermove", function (e) {
    var p = trackPointer(e);

    // En touch no hay hover: ahi manda el tap, mas abajo.
    if (e.pointerType !== "touch") {
      if (overBill) openWave(p.px, p.py); else closeWave();
    }

    if (!dragging) return;
    var dx = e.clientX - lastPointerX;
    lastPointerX = e.clientX;
    spin += dx * 0.006;
    // Inercia suavizada y con tope: tomar el ultimo dx crudo dejaba el billete
    // girando como un ventilador despues de un manotazo.
    var v = spinVel * 0.65 + dx * 0.0016;
    spinVel = Math.max(-0.05, Math.min(0.05, v));
  });
  dragEl.addEventListener("pointerleave", function (e) {
    pointerX = 0;
    pointerY = 0;
    overBill = false;
    dragEl.classList.remove("over");
    // En touch el puntero se destruye al soltar y dispara este evento: cerrar
    // aca deshacia el tap en el acto.
    if (e.pointerType !== "touch") closeWave();
  });
  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    dragEl.classList.remove("grabbing");
    if (e && e.pointerId !== undefined && dragEl.hasPointerCapture(e.pointerId)) {
      dragEl.releasePointerCapture(e.pointerId);
    }
  }
  dragEl.addEventListener("pointerup", endDrag);
  dragEl.addEventListener("pointercancel", endDrag);
  dragEl.addEventListener("lostpointercapture", endDrag);

  // --- arranque -------------------------------------------------------------
  Promise.all([
    loadTexture(IMG.frontGray, false),
    loadTexture(IMG.backGray, true),
    loadTexture(IMG.frontColor, false),
    loadTexture(IMG.backColor, true)
  ]).then(function (t) {
    tex = { frontGray: t[0], backGray: t[1], frontColor: t[2], backColor: t[3] };
    started = true;
    layout();
    frame();
  });
})();
</script>
</body>
</html>
