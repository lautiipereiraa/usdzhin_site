# Dev: hot reload, puerto al host y build del target `dev`.
# Compose lo carga solo, sin flags. Nunca se usa en producción.
#
# El `name` distinto es lo que aísla dev de prod: contenedores, redes y
# volúmenes quedan prefijados con `usdzhin-dev`, así que los dos stacks pueden
# convivir en el mismo daemon sin pisarse.
name: ${APP_NAME:-usdzhin}-dev

services:
  frontend:
    image: ${APP_NAME:-usdzhin}-frontend-dev
    container_name: ${APP_NAME:-usdzhin}-frontend-dev
    build:
      target: dev
      args:
        HOST_UID: ${HOST_UID:-1001}
        HOST_GID: ${HOST_GID:-1001}
    volumes:
      - ./:/app
      # node_modules como volumen: el bind mount de arriba, si no, taparía
      # el que instaló la imagen y dejaría el contenedor sin dependencias.
      - /app/node_modules
    ports:
      # Default 127.0.0.1: quien clone el repo no expone nada sin querer.
      # Poner BIND_HOST=0.0.0.0 en el .env local para abrirlo a internet.
      # Ojo: un puerto publicado por Docker no lo filtra el firewall del host.
      - "${BIND_HOST:-127.0.0.1}:${FRONTEND_PORT:-5173}:5173"
    environment:
      - NODE_ENV=development

networks:
  # El compose base la nombra `${APP_NAME}-network`. Si dev no la renombra, los
  # dos stacks apuntan a la misma red y Compose falla por el label de proyecto.
  app-network:
    name: ${APP_NAME:-usdzhin}-dev-network
