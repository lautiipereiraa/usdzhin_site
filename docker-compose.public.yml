# Publica producción directo al host, sin reverse proxy.
#
# Es un estado transitorio: mientras no haya dominio, no hay TLS que terminar
# ni hosts que rutear, así que nginx atiende el puerto 80 del VPS. Cuando
# entre Traefik, él toma 80/443 y este archivo deja de usarse — el compose
# base vuelve a ser correcto tal como está (sin puertos publicados).
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.public.yml up -d --build
#
# Nótese que NO se incluye docker-compose.override.yml: pasar -f explícito
# desactiva la carga automática del override de dev.

services:
  frontend:
    ports:
      # 80 en el host → 8080 en el contenedor (nginx-unprivileged no puede
      # bindear puertos privilegiados; el mapeo lo resuelve Docker).
      - "80:8080"
