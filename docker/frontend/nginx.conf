server {
    listen      8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # El bundle de Vite baja alrededor de un 70% con gzip
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml font/woff2;

    # Vite le pone hash al nombre de cada asset, así que el contenido de una URL
    # nunca cambia: se puede cachear de forma indefinida.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html es lo único que no se cachea: es lo que apunta a los assets
    # nuevos después de cada deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fallback de SPA. Hoy el proyecto no tiene client-side router, así que no
    # cambia nada; queda puesto para que agregar uno no requiera tocar nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los headers de seguridad (HSTS, CSP, X-Frame-Options) van en el reverse
    # proxy cuando lo montemos, no acá: un solo lugar donde definirlos evita
    # que se contradigan entre capas.
}
